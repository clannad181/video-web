# 服务端口
server:
  servlet:
    context-path: /api
  port: 8899

spring:
  # 邮件发送服务配置
  mail:
    host: smtp.qq.com
    port: 465
    username: 2657463589@qq.com
    password: ukilygkkaeisdjcg
    default-encoding: UTF-8
    properties:
      mail:
        debug: true
        smtp:
          socketFactory:
            class: javax.net.ssl.SSLSocketFactory
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  application:
    name: video-web
  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5432/video?currentSchema=public&sslmode=disable
    username: postgres
    password: postgres123
    driver-class-name: org.postgresql.Driver
  # redis配置
  data:
    redis:
      host: localhost
      port: 6379
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

# 文件上传配置
file:
  upload:
    path: D:/uploads          # 文件存储根路径
    url-prefix: /api/file/preview   # 文件访问地址前缀
    chunk-size: 5MB           # 单个分片最大大小
# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.cjym.videoweb.model.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete
      logic-delete-value: true
      logic-not-delete-value: false
